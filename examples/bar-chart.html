<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;padding:28px 36px 20px;width:960px;color:#222}
.title{font-size:22px;font-weight:700;color:#111;margin-bottom:2px}
.sub{font-size:11px;color:#999;margin-bottom:24px}
.source{font-size:9px;color:#bbb;margin-top:18px}
.row{display:flex;align-items:center;height:32px;margin-bottom:10px}
.label{width:140px;text-align:right;padding-right:14px;font-size:11px;color:#888}
.bar-area{flex:1;height:22px;background:#f5f5f5}
.bar{height:100%}
.val{width:65px;padding-left:10px;font-size:13px;color:#888}
.val.hi{color:#111;font-weight:700}
.hl{background:#c0392b}
.gr{background:#d5d5d5}
.md{background:#999}
</style></head><body>
<div class="title">[인사이트 제목]</div>
<div class="sub">[데이터 설명]</div>
<div class="row"><div class="label">항목 A</div><div class="bar-area"><div class="bar gr" style="width:20%"></div></div><div class="val">20%</div></div>
<div class="row"><div class="label">항목 B</div><div class="bar-area"><div class="bar md" style="width:50%"></div></div><div class="val">50%</div></div>
<div class="row"><div class="label">항목 C (강조)</div><div class="bar-area"><div class="bar hl" style="width:85%"></div></div><div class="val hi">85%</div></div>
<div class="source">Source: [출처]</div>
</body></html>
