<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;width:1080px;height:1350px;padding:80px 72px 60px;display:flex;flex-direction:column}
.slide-num{font-size:14px;color:#ccc;margin-bottom:40px}
.title{font-size:40px;font-weight:700;color:#111;line-height:1.3;margin-bottom:48px}
.layer{display:flex;align-items:center;margin-bottom:20px}
.layer-bar{height:56px;display:flex;align-items:center;padding:0 24px}
.layer-bar.l1{background:#111;color:#fff;width:100%;font-size:20px;font-weight:700}
.layer-bar.l2{background:#555;color:#fff;width:80%;font-size:18px;font-weight:700}
.layer-bar.l3{background:#d5d5d5;color:#555;width:60%;font-size:16px}
.layer-bar.accent{background:#c0392b;color:#fff;width:100%;font-size:20px;font-weight:700}
.layer-label{font-size:14px;color:#888;margin-left:16px}
.arrow-down{text-align:center;font-size:20px;color:#ccc;margin:4px 0}
.summary{margin-top:auto;padding:32px 0;border-top:1px solid #eee}
.summary-text{font-size:24px;color:#111;font-weight:700;line-height:1.5}
.summary-sub{font-size:18px;color:#888;margin-top:12px;line-height:1.5}
.bottom{font-size:12px;color:#ccc;margin-top:40px}
</style></head><body>
<div class="slide-num">08 / 09</div>
<div class="title">프롬프트 → 컨텍스트 → 하네스<br>세 층의 건축</div>
<div class="layer"><div class="layer-bar accent">하네스 (Harness)</div><div class="layer-label">LLM + 도구 + 검증 루프 = 에이전트</div></div>
<div class="arrow-down">↑</div>
<div class="layer"><div class="layer-bar l1">컨텍스트 엔지니어링</div><div class="layer-label">Write / Select / Compress / Isolate</div></div>
<div class="arrow-down">↑</div>
<div class="layer"><div class="layer-bar l2">프롬프트 엔지니어링</div><div class="layer-label">단어 선택, CoT, Few-shot</div></div>
<div class="arrow-down">↑</div>
<div class="layer"><div class="layer-bar l3">LLM (토큰 예측기)</div><div class="layer-label">Transformer, 어텐션, KV-Cache</div></div>
<div class="summary">
<div class="summary-text">프롬프트는 벽에 페인트칠.<br>컨텍스트는 건물의 골조.<br>하네스는 건물 전체의 설계도.</div>
<div class="summary-sub">골조가 부실하면 페인트칠을 아무리 잘해도 건물이 무너진다.</div>
</div>
<div class="bottom">@gongnangi</div>
</body></html>
