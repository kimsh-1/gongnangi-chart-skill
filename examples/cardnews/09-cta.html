<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;width:1080px;height:1350px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 72px}
.series-label{font-size:14px;color:#999;letter-spacing:2px;margin-bottom:40px}
.title{font-size:36px;font-weight:700;color:#111;text-align:center;line-height:1.4;margin-bottom:48px}
.divider{width:60px;height:2px;background:#c0392b;margin-bottom:48px}
.list{text-align:center;margin-bottom:48px}
.list-item{font-size:20px;color:#555;line-height:2.2}
.list-item .num{color:#c0392b;font-weight:700}
.list-item .current{color:#111;font-weight:700}
.cta{font-size:28px;font-weight:700;color:#111;text-align:center;margin-bottom:16px}
.cta-sub{font-size:18px;color:#888;text-align:center}
.handle{position:absolute;bottom:80px;font-size:24px;color:#c0392b;font-weight:700}
</style></head><body>
<div class="series-label">AI FUNDAMENTALS SERIES</div>
<div class="title">프롬프트의 한계를 넘어서<br>정보 건축의 시대로</div>
<div class="divider"></div>
<div class="list">
  <div class="list-item"><span class="num">01</span> 프롬프트 엔지니어링의 한계와 전환점</div>
  <div class="list-item"><span class="num">02</span> <span class="current">컨텍스트 엔지니어링 — 정보 건축의 시대</span></div>
  <div class="list-item"><span class="num">03</span> 하네스 — AI가 일하게 만드는 소프트웨어</div>
</div>
<div class="cta">저장하고 다음 편을 기다려주세요</div>
<div class="cta-sub">시리즈 전체를 보려면 프로필을 방문하세요</div>
<div class="handle">@gongnangi</div>
</body></html>
