<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;width:1080px;height:1350px;padding:80px 72px 60px;display:flex;flex-direction:column}
.slide-num{font-size:14px;color:#ccc;margin-bottom:40px}
.title{font-size:40px;font-weight:700;color:#111;line-height:1.3;margin-bottom:40px}
.data-row{display:flex;align-items:center;margin-bottom:20px}
.data-label{width:280px;font-size:20px;color:#888}
.data-bar-area{flex:1;height:28px;background:#f5f5f5}
.data-bar{height:100%}
.data-val{width:100px;padding-left:16px;font-size:22px;color:#888}
.data-val.hi{color:#c0392b;font-weight:700}
.gr{background:#d5d5d5}
.hl{background:#c0392b}
.md{background:#999}
.lt{background:#ccc}
.insight{margin-top:auto;padding:24px 0;border-top:1px solid #eee}
.insight-text{font-size:28px;font-weight:700;color:#111;line-height:1.4}
.insight-sub{font-size:18px;color:#888;margin-top:12px}
.bottom{font-size:12px;color:#ccc;margin-top:40px}
</style></head><body>
<div class="slide-num">03 / 09</div>
<div class="title">도구 출력이 전체의 80%를 차지한다</div>
<div class="data-row"><div class="data-label">도구 출력</div><div class="data-bar-area"><div class="data-bar hl" style="width:80%"></div></div><div class="data-val hi">80%+</div></div>
<div class="data-row"><div class="data-label">대화 기록</div><div class="data-bar-area"><div class="data-bar gr" style="width:5%"></div></div><div class="data-val">~5%</div></div>
<div class="data-row"><div class="data-label">시스템 프롬프트</div><div class="data-bar-area"><div class="data-bar md" style="width:5%"></div></div><div class="data-val">~5%</div></div>
<div class="data-row"><div class="data-label">도구 정의</div><div class="data-bar-area"><div class="data-bar lt" style="width:3%"></div></div><div class="data-val">~3%</div></div>
<div class="data-row"><div class="data-label">CLAUDE.md</div><div class="data-bar-area"><div class="data-bar lt" style="width:2%"></div></div><div class="data-val">~2%</div></div>
<div class="data-row"><div class="data-label">당신의 프롬프트</div><div class="data-bar-area"><div class="data-bar gr" style="width:0.5%"></div></div><div class="data-val">0.25%</div></div>
<div class="insight">
<div class="insight-text">프롬프트를 다듬는 건<br>5% 레버리지에 시간을 쏟는 것이다</div>
<div class="insight-sub">95%의 레버리지는 컨텍스트 관리에 있다</div>
</div>
<div class="bottom">@gongnangi</div>
</body></html>
