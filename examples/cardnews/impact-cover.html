<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Impact Center 01 Cover</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0A0A0A;color:#F0F0F0;font-family:'Noto Sans KR',sans-serif;padding:100px 72px 72px;position:relative;text-align:center}
.label{font-size:12px;font-weight:700;letter-spacing:5px;color:#999;text-transform:uppercase}
.number{font-size:238px;font-weight:900;line-height:.86;color:#c0392b;letter-spacing:0;margin-top:164px}
.number-caption{font-size:14px;font-weight:700;letter-spacing:5px;color:#bbb;margin-top:16px}
.title{margin-top:60px}
.title strong{display:block;font-size:56px;font-weight:900;line-height:1.14;color:#F0F0F0}
.title span{display:block;font-size:56px;font-weight:300;line-height:1.14;color:#aaa;margin-top:4px}
.copy{font-size:24px;font-weight:300;line-height:1.7;color:#666;margin-top:44px}
.copy b{font-weight:700;color:#F0F0F0}
.copy em{font-style:normal;font-weight:900;color:#c0392b}
.statement{font-size:38px;font-weight:900;line-height:1.28;color:#F0F0F0;margin-top:42px}
.statement em{font-style:normal;color:#c0392b}
.fine{font-size:20px;font-weight:300;line-height:1.65;color:#aaa;margin-top:28px}
.foot{position:absolute;left:72px;right:72px;bottom:72px;display:flex;justify-content:space-between;border-top:1px solid #1A1A1A;padding-top:20px}
.foot span{font-size:11px;font-weight:500;letter-spacing:1px;color:#777}
</style>
</head>
<body>
<div class="label">Context Engineering</div>
<div class="number">0.25%</div>
<div class="number-caption">OF YOUR CONTEXT WINDOW</div>
<div class="title">
  <strong>프롬프트 엔지니어링은</strong>
  <span>끝났다</span>
</div>
<div class="copy">30분 공들인 프롬프트 <b>500토큰</b><br>전체 200K 윈도우의 <em>0.25%</em></div>
<div class="statement">나머지 <em>99.75%</em>가<br>결과를 결정한다</div>
<div class="fine">프롬프트를 개선하면 프롬프트 토큰이 늘어나고,<br>그만큼 다른 정보가 밀려난다. 제로섬.</div>
<div class="foot"><span>AI FUNDAMENTALS 01/03</span><span>@gongnangi</span></div>
</body>
</html>
